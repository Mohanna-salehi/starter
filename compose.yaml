services:

  postgres:
    image: postgres:17-alpine
    container_name: pan-vault-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate

    container_name: pan-vault-migrate

    env_file:
      - .env

    command: ["./migrate"]

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  redis:
    image: redis:8-alpine
    container_name: pan-vault-redis

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  app:
    build:
      context: .
      target: app
    container_name: pan-vault-app

    ports:
      - "8080:8080"

    environment:
      PAN_VAULT_ADDR: "0.0.0.0:8080"
      POSTGRES_PORT : "5432"
      REDIS_ADDR : "redis:6379"
      POSTGRES_HOST: "postgres"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: "disable"
      DEFAULT_USER: "user"
      DEFAULT_PASS: "password"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    restart: unless-stopped

volumes:
  postgres_data:
  redis-data:
